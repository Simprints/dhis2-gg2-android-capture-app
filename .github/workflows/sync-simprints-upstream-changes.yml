name: Sync Simprints-related changes from EyeSeeTea upstream hourly
on:
  schedule:
    - cron: '0 8-18 * * 1-5'
  workflow_dispatch:
  pull_request:
    types:
      - closed

concurrency:
  group: sync-simprints-upstream-changes
  cancel-in-progress: false

jobs:
  sync-simprints-upstream-changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: sync_develop
        name: Sync develop-simprints branch
        run: |
          set -euo pipefail
          gh repo sync "$CURRENT_FORK_REPOSITORY" --source "$UPSTREAM_REPOSITORY" --branch "develop-simprints"
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_SYNC_PAT }}

      - id: sync_release
        name: Sync release-simprints branch
        run: |
          set -euo pipefail
          upstream_sync_branch="release-simprints"
          head_before_sync=$(gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$upstream_sync_branch" --jq '.commit.sha')
          gh repo sync "$CURRENT_FORK_REPOSITORY" --source "$UPSTREAM_REPOSITORY" --branch "$upstream_sync_branch"
          head_after_sync=$(gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$upstream_sync_branch" --jq '.commit.sha')
          upstream_head_sha=$(gh api "repos/$UPSTREAM_REPOSITORY/branches/$upstream_sync_branch" --jq '.commit.sha')

          if [[ "$head_after_sync" != "$upstream_head_sha" ]]; then
            gh api --method PATCH "repos/$CURRENT_FORK_REPOSITORY/git/refs/heads/$upstream_sync_branch" \
              --raw-field sha="$upstream_head_sha" \
              --field force=true >/dev/null
            head_after_sync=$(gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$upstream_sync_branch" --jq '.commit.sha')
            echo "Aligned $upstream_sync_branch to upstream head $upstream_head_sha."
          fi

          echo "release_head_sha=$head_after_sync" >> "$GITHUB_OUTPUT"
          if [[ "$head_before_sync" != "$head_after_sync" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes synced into $upstream_sync_branch."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes in $upstream_sync_branch."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_SYNC_PAT }}

      - id: prepare_release_pr
        name: Prepare release PR branch
        if: steps.sync_release.outputs.changed == 'true'
        run: |
          set -euo pipefail

          cleanup_upstream_only_workflows() {
            branch="$1"

            get_workflow_paths() {
              source_branch="$1"
              source_tree_sha=$(gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$source_branch" --jq '.commit.commit.tree.sha')
              gh api "repos/$CURRENT_FORK_REPOSITORY/git/trees/$source_tree_sha?recursive=1" \
                --jq '.tree[] | select(.type == "blob" and (.path | startswith(".github/workflows/"))) | .path' \
                | LC_ALL=C sort -u
            }

            main_workflows=$(get_workflow_paths "main")
            branch_workflows=$(get_workflow_paths "$branch")

            if [[ -z "$branch_workflows" ]]; then
              echo "No workflow files found in $branch."
              return
            fi

            workflows_to_delete=$(comm -23 \
              <(printf '%s\n' "$branch_workflows" | sed '/^$/d') \
              <(printf '%s\n' "$main_workflows" | sed '/^$/d'))

            if [[ -z "$workflows_to_delete" ]]; then
              echo "No upstream-only workflow files to delete in $branch."
              return
            fi

            head_sha=$(gh api "repos/$CURRENT_FORK_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
            base_tree_sha=$(gh api "repos/$CURRENT_FORK_REPOSITORY/git/commits/$head_sha" --jq '.tree.sha')
            delete_tree_entries=$(printf '%s\n' "$workflows_to_delete" | jq -Rsc 'split("\n") | map(select(length > 0) | {path: ., mode: "100644", type: "blob", sha: null})')

            new_tree_sha=$(
              jq -n \
                --arg base_tree "$base_tree_sha" \
                --argjson tree "$delete_tree_entries" \
                '{base_tree: $base_tree, tree: $tree}' \
              | gh api "repos/$CURRENT_FORK_REPOSITORY/git/trees" --method POST --input - --jq '.sha'
            )

            commit_message="Fork Sync: Removed upstream-only workflow files from $branch."
            new_commit_sha=$(
              jq -n \
                --arg message "$commit_message" \
                --arg tree "$new_tree_sha" \
                --arg parent "$head_sha" \
                '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api "repos/$CURRENT_FORK_REPOSITORY/git/commits" --method POST --input - --jq '.sha'
            )

            gh api --method PATCH "repos/$CURRENT_FORK_REPOSITORY/git/refs/heads/$branch" \
              --raw-field sha="$new_commit_sha" >/dev/null

            echo "$commit_message"
            printf '%s\n' "$workflows_to_delete"
          }

          release_head_sha="${{ steps.sync_release.outputs.release_head_sha }}"
          pr_branch="release-simprints-pr-${release_head_sha:0:12}"
          echo "pr_branch=$pr_branch" >> "$GITHUB_OUTPUT"

          existing_pr_count=$(gh pr list --repo "$CURRENT_FORK_REPOSITORY" --base "main" --head "$pr_branch" --state "open" --json number --jq 'length')
          if [[ "$existing_pr_count" -gt 0 ]]; then
            echo "An open PR already exists for $pr_branch."
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$pr_branch" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$CURRENT_FORK_REPOSITORY/git/refs/heads/$pr_branch" \
              --raw-field sha="$release_head_sha" \
              --field force=true >/dev/null
            echo "Reset $pr_branch to release-simprints head."
          else
            gh api --method POST "repos/$CURRENT_FORK_REPOSITORY/git/refs" \
              --raw-field ref="refs/heads/$pr_branch" \
              --raw-field sha="$release_head_sha" >/dev/null
            echo "Created $pr_branch from release-simprints head."
          fi

          cleanup_upstream_only_workflows "$pr_branch"
          echo "create_pr=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_SYNC_PAT }}

      - name: Create PR for release-simprints changes
        if: steps.sync_release.outputs.changed == 'true' && steps.prepare_release_pr.outputs.create_pr == 'true'
        run: |
          set -euo pipefail
          pr_branch="${{ steps.prepare_release_pr.outputs.pr_branch }}"
          main_tree_sha=$(gh api "repos/$CURRENT_FORK_REPOSITORY/branches/main" --jq '.commit.commit.tree.sha')
          pr_tree_sha=$(gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$pr_branch" --jq '.commit.commit.tree.sha')
          if [[ "$main_tree_sha" == "$pr_tree_sha" ]]; then
            echo "No content differences between $pr_branch and main after workflow cleanup."
            gh api --method DELETE "repos/$CURRENT_FORK_REPOSITORY/git/refs/heads/$pr_branch" >/dev/null
            echo "Deleted $pr_branch because there are no PR changes to merge."
            exit 0
          fi

          pr_title="[Automatic] Sync release update from upstream EyeSeeTea DHIS2"
          pr_body=$(cat <<EOF
          These changes, synced from upstream into \`release-simprints\`, and then copied into this \`$pr_branch\` branch but with the upstream workflow files removed, are to be merged into the \`main\` branch.

          _For your reference, this Action's config can be viewed [here](https://github.com/Simprints/dhis2-gg2-android-capture-app/blob/main/.github/workflows/sync-simprints-upstream-changes.yml), and the run logs [here](https://github.com/Simprints/dhis2-gg2-android-capture-app/actions/workflows/sync-simprints-upstream-changes.yml)._
          EOF
          )

          pr_labels="upstream-sync,automatic,github-action"
          gh pr create --repo "$CURRENT_FORK_REPOSITORY" --base "main" --head "$pr_branch" --title "$pr_title" --body "$pr_body" --label "$pr_labels"
        env:
          GH_TOKEN: ${{ github.token }}
    env:
      CURRENT_FORK_REPOSITORY: ${{ github.repository }}
      UPSTREAM_REPOSITORY: EyeSeeTea/dhis2-android-capture-app

  delete-closed-sync-pr-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.event.pull_request.head.ref, 'release-simprints-pr-') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete closed sync PR branch
        run: |
          set -euo pipefail
          pr_branch="$PR_BRANCH"
          if gh api "repos/$CURRENT_FORK_REPOSITORY/branches/$pr_branch" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$CURRENT_FORK_REPOSITORY/git/refs/heads/$pr_branch" >/dev/null
            echo "Deleted $pr_branch."
          else
            echo "Branch $pr_branch is already absent."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          CURRENT_FORK_REPOSITORY: ${{ github.repository }}
